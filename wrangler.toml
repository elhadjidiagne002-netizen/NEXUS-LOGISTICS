# Cloudflare Pages (interface construite par Vite → dist/) + Pages Functions (functions/ → server/) + D1.
# Déployer DEPUIS LA RACINE du dépôt (sinon functions/ n'est pas envoyé) :
#   npm run build:api && npx wrangler pages deploy dist --project-name nexus-logistics --branch main
# Nouvelles migrations D1 (migrations/) — AVANT le déploiement :
#   npx wrangler d1 migrations apply nexus-logistics --remote
# Déploiement automatique : .github/workflows/deploy.yml (secret CLOUDFLARE_API_TOKEN).
name = "nexus-logistics"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "nexus-logistics"
database_id = "b6751d1e-0d5f-44a7-b24a-b54ee6f136cf"
migrations_dir = "migrations"

# Photos et signatures de preuve (cycle C5). Sans cette liaison, elles sont gardées dans la table `files` de D1
# (repli gratuit, ≤ 1,5 Mo par fichier). Pour passer à R2 (10 Go gratuits) : créer le compartiment
#   npx wrangler r2 bucket create nexus-logistics-preuves
# puis décommenter les trois lignes ci-dessous (les fichiers déjà en D1 restent lisibles).
# [[r2_buckets]]
# binding = "PROOFS"
# bucket_name = "nexus-logistics-preuves"

# Secrets de la plateforme (jamais dans ce fichier) — à poser une fois :
#   npx wrangler pages secret put CRON_SECRET  --project-name nexus-logistics   (tâches planifiées, voir cron/)
#   npx wrangler pages secret put SECRETS_KEY  --project-name nexus-logistics   (chiffre les jetons WhatsApp des entreprises)
#   npx wrangler pages secret put BREVO_API_KEY --project-name nexus-logistics  (e-mail de secours, facultatif)
# Variable facultative : BREVO_SENDER (adresse d'expédition validée chez Brevo).
