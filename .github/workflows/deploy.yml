# Déploiement automatique de NEXUS Logistics (Cloudflare Pages) à chaque push sur main.
# Prérequis (une seule fois) : secret CLOUDFLARE_API_TOKEN (jeton « Cloudflare Pages : Modifier »),
# le même que pour Devizo, My shop et CV en ligne.
# Ordre : tests → construction → migrations D1 (migrations/) → publication → vérification.
# Les migrations passent AVANT la publication : jamais de code en ligne plus récent que le schéma.
# Le jeton doit aussi avoir le droit « D1 : Modifier » (sinon l'étape des migrations échoue et rien n'est publié).
name: Déploiement production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Jamais deux déploiements en parallèle : le second attend la fin du premier.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b052ef72eb7bca73ee5f8a26be23f8d2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation
        run: |
          npm ci
          npm ci --prefix mail

      # Logique serveur (D1 imitée sur node:sqlite) et algorithmes de l'interface
      - name: Tests (serveur + algorithmes)
        run: npm test

      - name: Construction
        run: npm run build

      - name: Jeton Cloudflare présent ?
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN manquant (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Migrations D1
        run: npx --yes wrangler@latest d1 migrations apply nexus-logistics --remote

      - name: Déploiement Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy dist --project-name nexus-logistics --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --pretty=%s)" --commit-dirty=true

      - name: Vérification de la production
        run: |
          sleep 15
          page=$(curl -sf https://logistique.nexusmarket.sn/)
          echo "$page" | grep -q '<title>NEXUS Logistics</title>'
          # le script de la page publiée doit être celui de ce build (cache immuable sur /assets/*)
          entry=$(grep -o 'src="/assets/index-[^"]*\.js"' dist/index.html | head -1)
          echo "$page" | grep -q "$entry"
          curl -sf https://logistique.nexusmarket.sn/suivi/00000000-0000-4000-a000-000000000000 | grep -q '<div id="root">'
          curl -sf https://logistique.nexusmarket.sn/sw.js | grep -q "nexus-logistics-v"
          curl -sf https://logistique.nexusmarket.sn/api/health | grep -q '"ok":true'
          echo "Production OK ($entry)"
